site_name: Agilex 5 Bare-Metal Lab
site_description: Learn AArch64 development with VS Code, QEMU and the Agilex 5 Modular kit.
site_url: https://aew2015.github.io/baremetal-drivers/
repo_url: https://github.com/AEW2015/baremetal-drivers
repo_name: AEW2015/baremetal-drivers
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
nav:
  - Start here: index.md
  - Tutorial:
      - 1. Install the tools: setup.md
      - Recreate the container: container.md
      - Obtain the FPGA design: fpga-design.md
      - 2. Set up VS Code: vscode.md
      - 3. Run and debug QEMU: qemu.md
      - Simics 26.3 virtual HPS: simics.md
      - 4. Run on the Modular kit: hardware.md
      - 5. Fabric IP, map and driver: fabric-ip.md
      - 6. Swap IP with partial reconfiguration: partial-reconfiguration.md
  - Examples:
      - Overview: examples.md
      - Complete platform catalog: example-catalog.md
      - Shared labs on QEMU, Simics and hardware: cross-platform.md
      - QEMU CPU, NEON and RAM: examples/qemu.md
      - Six QEMU practice labs: examples/qemu-labs.md
      - Simics upstream and legacy examples: simics.md
      - OCRAM UART Hello: examples/ocram.md
      - DDR bring-up and Hello: examples/ddr.md
      - "CPU, NEON and core checks": examples/core.md
      - "DMA: 4096-byte transfer": examples/dma.md
      - "GIC: secure software interrupt": examples/gic.md
      - "MMU: EL3 translation and readback": examples/mmu.md
      - "Multicore: release A55/A76 secondaries": examples/multicore.md
      - "SOM: timer, watchdog, SPI and GPIO": examples/som.md
      - "GPIO I2C: temperature sensor and EEPROM": examples/som-i2c.md
      - "I3C1 controller: legacy-I2C reads": examples/som-i3c.md
      - "Ethernet bandwidth: UDP and TCP": examples/ethernet.md
      - "Ethernet PHY, SD and USB identification": examples/interfaces.md
      - "SDM mailbox: read FPGA IDCODE": examples/mailbox.md
      - "Vendor UART transmit example": examples/vendor-uart.md
      - "Vendor CCU register checks": examples/vendor-ccu.md
      - "Vendor clock-manager register readout": examples/vendor-clkmgr.md
      - "Vendor SMMU identity check": examples/vendor-smmu.md
      - "Vendor ECC register/default checks": examples/vendor-ecc.md
  - Reference:
      - Codex skill: agent-skill.md
      - Validation and limits: validation.md
      - Fresh-clone remote validation: remote-validation.md
      - Upstream 26.3 API and migration: upstream-26.3.md
      - New upstream example tests: upstream-examples-validation.md
      - Runtime fixes and hardware queue: runtime-fixes.md
      - Ethernet hardware measurements: ethernet-validation.md
      - Troubleshooting: troubleshooting.md
      - Simulated student reviews: student-review.md
      - Onboarding and desktop follow-up: feedback-followup.md
      - Build this website: website.md

# Upstream Natural Docs reference sources are viewed on GitHub, not as tutorial pages.
exclude_docs: |
  TERMINOLOGY.md
  examples/README.md
