name: Tutorial and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tutorial-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install freestanding cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-system-arm gdb-multiarch verilator g++ make cmake ninja-build
      - name: Check QEMU, fabric RTL and driver builds
        working-directory: examples/agilex5-modular
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          ./qemu/build.sh
          python3 qemu/run.py --check
          python3 qemu/experiment.py
          bash qemu/labs/build.sh
          python3 qemu/labs/run.py --negative --gdb
          bash qemu/labs/build.sh agilex5
          python3 catalog.py --check
          AGILEX_TEST_REAL_QEMU=1 python3 -m unittest discover -s tests -v
          ./simics/build.sh OCRAM
          ./simics/build.sh DDR
          bash upstream-lab/build.sh qemu
          python3 upstream-lab/run.py qemu --only crc,perf,smc-guard,perf-zero-clock
          bash upstream-lab/build.sh agilex5
          bash upstream-lab/build_bl31.sh
          ./fabric/test.sh
          LAB_CPU_BASE=0x20020000 ./fabric/build.sh
  ethernet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the checksum-pinned Arm bare-metal compiler
        run: sudo bash examples/agilex5-modular/container/install-arm.sh
      - name: Build both Ethernet memory configurations
        working-directory: examples/agilex5-modular
        run: |
          export PATH="/opt/arm-gnu-toolchain-13.2.Rel1-x86_64-aarch64-none-elf/bin:$PATH"
          NET_CACHED=0 ./ethernet/build.sh
          NET_CACHED=1 ./ethernet/build.sh
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - name: Render the clickable Agilex architecture
        run: |
          python tools/architecture/build_diagram.py
          python tools/architecture/build_diagram.py --check
      - run: mkdocs build --strict
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  diagram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the browser test tools
        run: |
          python -m pip install -r tools/architecture/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check all diagram examples and interactions offline
        run: |
          python tools/architecture/build_diagram.py
          python tools/architecture/build_diagram.py --check
          python tools/architecture/test_browser.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, qemu, ethernet, diagram]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
